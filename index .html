<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrafoLab | Matemática Interativa</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#f4f7ff;font-family:Arial,sans-serif}
header{padding:25px 18px;background:#17243a;border-bottom:1px solid #30415e}
header h1{margin:0;color:#65e5d1;font-size:30px}
header p{color:#b8c5d9}
main{max-width:950px;margin:auto;padding:18px}
section{background:#1a2940;padding:18px;border-radius:15px;margin-bottom:18px}
h2{color:#65e5d1;margin-top:0}
input,button{padding:12px;border-radius:9px;border:1px solid #526580;font-size:16px}
input{background:#101827;color:white;max-width:100%;width:100%;margin:6px 0}
button{background:#65e5d1;color:#10202c;font-weight:bold;border:0;margin:5px;cursor:pointer}
button:hover{opacity:.85}
canvas{width:100%;height:310px;background:#f8fbff;border-radius:10px;display:block}
.resultado{font-size:20px;color:#65e5d1;min-height:28px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid button{margin:0}
footer{text-align:center;color:#9aabc2;padding:25px}
@media(max-width:500px){.grid{grid-template-columns:1fr}header h1{font-size:25px}}
</style>
</head>
<body>
<header>
<h1>✦ GrafoLab</h1>
<p>Explore a matemática. Crie, calcule e descubra!</p>
</header>
<main>
<section>
<h2>📈 Gráfico de funções</h2>
<p>Digite uma função usando x. Exemplos: x^2, 2*x+1, sin(x), cos(x).</p>
<input id="funcao" value="x^2" placeholder="Digite uma função">
<button onclick="desenhar()">Desenhar gráfico</button>
<canvas id="grafico" width="900" height="420"></canvas>
<p id="status" class="resultado">Gráfico de x²</p>
</section>

<section>
<h2>🧮 Calculadora</h2>
<input id="conta" placeholder="Exemplo: (10+5)*2">
<div class="grid">
<button onclick="adicionar('7')">7</button>
<button onclick="adicionar('8')">8</button>
<button onclick="adicionar('9')">9</button>
<button onclick="adicionar('/')">÷</button>
<button onclick="adicionar('4')">4</button>
<button onclick="adicionar('5')">5</button>
<button onclick="adicionar('6')">6</button>
<button onclick="adicionar('*')">×</button>
<button onclick="adicionar('1')">1</button>
<button onclick="adicionar('2')">2</button>
<button onclick="adicionar('3')">3</button>
<button onclick="adicionar('-')">−</button>
<button onclick="adicionar('0')">0</button>
<button onclick="adicionar('.')">.</button>
<button onclick="calcular()">=</button>
<button onclick="adicionar('+')">+</button>
</div>
<button onclick="limpar()">Limpar</button>
<p id="resposta" class="resultado"></p>
</section>

<section>
<h2>📐 Geometria</h2>
<p>Escolha uma figura e informe suas medidas.</p>
<select id="figura" onchange="atualizarCampos()" style="padding:12px;width:100%;border-radius:8px">
<option value="quadrado">Quadrado</option>
<option value="retangulo">Retângulo</option>
<option value="triangulo">Triângulo</option>
<option value="circulo">Círculo</option>
</select>
<input id="medida1" type="number" placeholder="Lado ou base">
<input id="medida2" type="number" placeholder="Altura (quando necessário)">
<button onclick="geometria()">Calcular área</button>
<p id="area" class="resultado"></p>
</section>
</main>
<footer>GrafoLab • Aprender matemática pode ser incrível!</footer>

<script>
function adicionar(v){
document.getElementById('conta').value+=v;
}
function limpar(){
document.getElementById('conta').value='';
document.getElementById('resposta').textContent='';
}
function calcular(){
try{
let e=document.getElementById('conta').value;
if(!/^[0-9+\-*/().\s]+$/.test(e))throw Error();
let r=Function('"use strict";return ('+e+')')();
if(!Number.isFinite(r))throw Error();
document.getElementById('resposta').textContent='Resultado: '+r;
}catch{
document.getElementById('resposta').textContent='Confira a expressão digitada.';
}
}
function desenhar(){
const c=document.getElementById('grafico');
const ctx=c.getContext('2d');
const expr=document.getElementById('funcao').value.trim();
ctx.clearRect(0,0,c.width,c.height);
ctx.strokeStyle='#dce3ed';ctx.lineWidth=1;
for(let x=0;x<=900;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,420);ctx.stroke();}
for(let y=0;y<=420;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke();}
ctx.strokeStyle='#293b55';ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(450,0);ctx.lineTo(450,420);ctx.moveTo(0,210);ctx.lineTo(900,210);ctx.stroke();
try{
let formula=expr.replace(/\^/g,'**');
if(!/^[0-9xX+\-*/().\sA-Za-z*]+$/.test(formula))throw Error();
let f=new Function('x','return '+formula.replace(/\b(sin|cos|tan|sqrt|abs|log|exp)\b/g,'Math.$1'));
ctx.strokeStyle='#087fdb';ctx.lineWidth=3;ctx.beginPath();
let iniciou=false;
for(let px=0;px<=900;px++){
let x=(px-450)/30;
let y=f(x);
let py=210-y*30;
if(!Number.isFinite(py)||Math.abs(py)>2000){iniciou=false;continue;}
if(!iniciou){ctx.moveTo(px,py);iniciou=true;}else ctx.lineTo(px,py);
}
ctx.stroke();
document.getElementById('status').textContent='Gráfico de '+expr;
}catch{
document.getElementById('status').textContent='Não consegui interpretar essa função. Tente usar x^2 ou 2*x+1.';
}
}
function atualizarCampos(){
let f=document.getElementById('figura').value;
document.getElementById('medida2').style.display=
(f==='quadrado'||f==='circulo')?'none':'block';
document.getElementById('medida1').placeholder=
f==='circulo'?'Raio':f==='quadrado'?'Lado':'Base';
}
function geometria(){
let f=document.getElementById('figura').value;
let a=Number(document.getElementById('medida1').value);
let b=Number(document.getElementById('medida2').value);
if(!a||a<0||((f==='retangulo'||f==='triangulo')&&(!b||b<0))){
document.getElementById('area').textContent='Digite medidas válidas.';
return;
}
let r;
if(f==='quadrado')r=a*a;
if(f==='retangulo')r=a*b;
if(f==='triangulo')r=a*b/2;
if(f==='circulo')r=Math.PI*a*a;
document.getElementById('area').textContent='Área: '+r.toFixed(2)+' unidades²';
}
atualizarCampos();
desenhar();
</script>
</body>
</html>
